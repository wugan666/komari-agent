name: Publish Owned Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owned-snapshot-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'wugan666/komari-agent' && github.ref == 'refs/heads/owned'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      channel: snapshot
