name: Build Owned Agent

on:
  push:
    branches: [owned]
  pull_request:
    branches: [owned]

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'wugan666/komari-agent'
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, "386", arm]
        exclude:
          - {goos: windows, goarch: arm}
          - {goos: darwin, goarch: "386"}
          - {goos: darwin, goarch: arm}
        include:
          - {goos: linux, goarch: loong64}
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8"
          cache: false
      - name: Build verification artifact
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          binary="komari-agent-${GOOS}-${GOARCH}"
          if [ "$GOOS" = windows ]; then binary="$binary.exe"; fi
          version="0.0.0-dev+${GITHUB_SHA}"
          go build -trimpath -ldflags="-s -w -X github.com/komari-monitor/komari-agent/update.CurrentVersion=$version -X github.com/komari-monitor/komari-agent/update.Repo=$GITHUB_REPOSITORY" -o "$binary"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komari-agent-*
          if-no-files-found: error
          retention-days: 7
