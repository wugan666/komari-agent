name: Regenerate Owned Release Notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing owned release tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-release-notes:
    if: github.repository == 'wugan666/komari-agent' && github.ref == 'refs/heads/owned'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate owned tag and regenerate notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ || "$TAG" =~ ^Snapshot-[0-9]{12}-[0-9]+-[0-9]+$ ]]
          git fetch --no-tags origin owned "refs/tags/$TAG:refs/tags/$TAG"
          tag_sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor "$tag_sha" origin/owned
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f "tag_name=$TAG" -f "target_commitish=$tag_sha" --jq .body > generated-notes.md
          printf '\n\nOwned build from commit %s. SHA-256 checksums accompany every binary.\n' "$tag_sha" >> generated-notes.md
          test -s generated-notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file generated-notes.md
