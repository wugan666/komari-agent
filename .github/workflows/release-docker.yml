name: Publish Owned Docker Image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'wugan666/komari-agent' && github.ref == 'refs/heads/owned'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify source commit and image tags
        id: image
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          owned_sha="$(git ls-remote origin refs/heads/owned | cut -f1)"
          test "$owned_sha" = "$GITHUB_SHA"
          case "$CHANNEL" in
            stable)
              [[ "$VERSION" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
              moving_tag=latest
              ;;
            snapshot)
              [[ "$VERSION" =~ ^Snapshot-[0-9]{12}-[0-9]+-[0-9]+$ ]]
              moving_tag=snapshot
              ;;
            *) exit 1 ;;
          esac
          git fetch --no-tags --depth=1 origin "refs/tags/$VERSION"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tags=$image:$VERSION,$image:$moving_tag" >> "$GITHUB_OUTPUT"
      - name: Use the tested release binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-komari-agent-linux-*
          merge-multiple: true
      - name: Check image binaries
        run: |
          set -euo pipefail
          sha256sum --strict --check komari-agent-linux-amd64.sha256 komari-agent-linux-arm64.sha256
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/wugan666/komari-agent
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          provenance: true
