name: Publish Owned Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New stable SemVer tag, for example v1.5.12"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: owned-stable-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'wugan666/komari-agent' && github.ref == 'refs/heads/owned'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      channel: stable
      version: ${{ inputs.version }}
